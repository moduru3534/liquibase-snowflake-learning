name: liquibase snowflake deployment

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - 'liquibase/**'
      - '.github/workflows/deploy.yml'
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - dev
      - main
    paths:
      - 'liquibase/**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    if: ${{ github.event_name == 'pull_request' }}
    environment: dev
    runs-on: ubuntu-latest
    env:
      SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
      SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_USER }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: setup java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: configure snowflake oidc
        uses: snowflakedb/snowflake-actions@v3.0.0
        with:
          use-oidc: true
          cli-version: '3.16'

      - name: test snowflake connection
        env:
          SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT }}
        run: snow connection test -x

      - name: setup liquibase
        uses: liquibase/setup-liquibase@v3
        with:
          edition: community
          version: '4.33.0'

      - name: prepare supported snowflake jdbc driver
        run: |
          liquibase_path="$(readlink -f "$(command -v liquibase)")"
          liquibase_dir="$(dirname "$liquibase_path")"
          for lib_dir in "$liquibase_dir/internal/lib" "$liquibase_dir/lib" "$liquibase_dir/../internal/lib" "$liquibase_dir/../lib"; do
            if [ -d "$lib_dir" ]; then
              find "$lib_dir" -type f -name 'snowflake-jdbc*.jar' -delete
            fi
          done
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/snowflake-jdbc-4.3.2.jar" \
            https://repo1.maven.org/maven2/net/snowflake/snowflake-jdbc/4.3.2/snowflake-jdbc-4.3.2.jar

      - name: build ci properties
        env:
          SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlencode

          params = {
              "db": os.environ["SNOWFLAKE_DATABASE"],
              "schema": "trading_use_case",
              "warehouse": os.environ["SNOWFLAKE_WAREHOUSE"],
              "role": os.environ["SNOWFLAKE_ROLE"],
              "user": os.environ["SNOWFLAKE_USER"],
              "authenticator": "WORKLOAD_IDENTITY",
              "workloadIdentityProvider": "OIDC",
              "token": os.environ["SNOWFLAKE_TOKEN"],
          }
          url = "jdbc:snowflake://" + os.environ["SNOWFLAKE_ACCOUNT"] + ".snowflakecomputing.com/?" + urlencode(params)
          with open("liquibase/liquibase.ci.properties", "w", encoding="utf-8") as properties:
              properties.write("changelogFile=liquibase/changelog-root.xml\n")
              properties.write("driver=net.snowflake.client.jdbc.SnowflakeDriver\n")
              properties.write("liquibaseSchemaName=trading_use_case\n")
              properties.write(
                  "liquibase.command.changelogParameters.database_name="
                  + os.environ["SNOWFLAKE_DATABASE"]
                  + "\n"
              )
              properties.write("url=" + url + "\n")
          PY

      - name: validate changelog
        run: |
          liquibase \
            --defaults-file=liquibase/liquibase.ci.properties \
            --classpath="$RUNNER_TEMP/snowflake-jdbc-4.3.2.jar" \
            validate

  deploy-dev:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
    environment: dev
    runs-on: ubuntu-latest
    env:
      SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
      SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_USER }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: setup java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: configure snowflake oidc
        uses: snowflakedb/snowflake-actions@v3.0.0
        with:
          use-oidc: true
          cli-version: '3.16'

      - name: test snowflake connection
        env:
          SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT }}
        run: snow connection test -x

      - name: setup liquibase
        uses: liquibase/setup-liquibase@v3
        with:
          edition: community
          version: '4.33.0'

      - name: prepare supported snowflake jdbc driver
        run: |
